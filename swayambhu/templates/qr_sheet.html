<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Quest QR sheet</title><style>main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}article{text-align:center;break-inside:avoid;border:1px solid #ccc;padding:15px}img{width:180px} @media print{button{display:none}}</style></head><body><h1>AI QR Quest · QR sheet</h1><button onclick="window.print()">Print QR sheet</button><main>{% for qr in qrs %}<article><h2>{{ qr.title or qr.qr_id }}</h2><p>{{ qr.qr_id }} · Round {{ qr.round.number }}</p><img src="{{ url_for('qr.qr_image',qr_pk=qr.id) }}" alt="{{ qr.qr_id }}"><p>{{ qr.status }}</p></article>{% endfor %}</main></body></html>
